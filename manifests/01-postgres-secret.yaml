---
# Throwaway credentials for the POC only - rotate/replace before any non-disposable use.
apiVersion: v1
kind: Secret
metadata:
  name: pg-poc-credentials
  labels:
    app.kubernetes.io/part-of: pgbouncer-poc
type: Opaque
stringData:
  POSTGRES_DB: "<DB_NAME>"
  POSTGRES_USER: "<DB_USER>"
  POSTGRES_PASSWORD: "<DB_PASSWORD>"
