---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pg-poc-data
  labels:
    app.kubernetes.io/part-of: pgbouncer-poc
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  # storageClassName intentionally omitted - uses the namespace/cluster default.
  # Uncomment and set explicitly if your OKD cluster requires it:
  # storageClassName: gp3-csi
