---
apiVersion: v1
kind: ConfigMap
metadata:
  name: pgbouncer-poc-config
  labels:
    app.kubernetes.io/part-of: pgbouncer-poc
data:
  pgbouncer.ini: |
    [databases]
    pocdb = host=pg-pgb port=5432 dbname=pocdb

    [pgbouncer]
    listen_addr = *
    listen_port = 5432
    auth_type = plain
    auth_file = /etc/pgbouncer/userlist.txt

    ; Transaction pooling is what lets many client connections share a small
    ; number of real Postgres backends - this is the core of the POC.
    pool_mode = transaction

    ; Client-facing ceiling: how many app-side sockets PGBouncer will accept.
    ; Set far above Postgres's own max_connections to prove out the multiplexing.
    max_client_conn = 2000

    ; Real backend connections PGBouncer will open to Postgres per database.
    ; Keep well under Postgres's max_connections (100) to leave headroom.
    default_pool_size = 80
    min_pool_size = 5
    reserve_pool_size = 10
    reserve_pool_timeout = 3

    admin_users = poc_user
    stats_users = poc_user

    ignore_startup_parameters = extra_float_digits
    log_connections = 1
    log_disconnections = 1
    log_pooler_errors = 1
    log_stats = 1
    stats_period = 10

    logfile =
    pidfile =
