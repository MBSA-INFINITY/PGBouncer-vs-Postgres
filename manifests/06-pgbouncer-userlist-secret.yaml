---
# Plaintext entry is intentional: PGBouncer hashes it on the fly to authenticate
# against Postgres, avoiding the need to hand-compute md5(password+username).
# Throwaway POC credential - keep in sync with 01-postgres-secret.yaml.
apiVersion: v1
kind: Secret
metadata:
  name: pgbouncer-poc-userlist
  labels:
    app.kubernetes.io/part-of: pgbouncer-poc
type: Opaque
stringData:
  userlist.txt: |
    "<DB_USER>" "<DB_PASSWORD>"
