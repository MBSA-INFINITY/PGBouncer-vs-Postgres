---
# Throwaway credentials for the POC only - dedicated Postgres instance sitting behind PGBouncer,
# separate from pg-poc so the direct-connection test and the pooled test never share a connection budget.
apiVersion: v1
kind: Secret
metadata:
  name: pg-pgb-credentials
  labels:
    app.kubernetes.io/part-of: pgbouncer-poc
type: Opaque
stringData:
  POSTGRES_DB: "<DB_NAME>"
  POSTGRES_USER: "<DB_USER>"
  POSTGRES_PASSWORD: "<DB_PASSWORD>"
